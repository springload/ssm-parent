name: Vulnerability Scan

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: self-hosted
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        id: scan
        run: |
          if govulncheck ./...; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: notify slack
        if: steps.scan.outputs.found == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_USERGROUP_ID: ${{ vars.SLACK_USERGROUP_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TEXT="<!subteam^${SLACK_USERGROUP_ID}> govulncheck found a reachable vulnerability in \`ssm-parent\`. <${RUN_URL}|View the run> for details."

          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$TEXT" '{channel: $channel, text: $text}')"
